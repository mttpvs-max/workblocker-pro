<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkBlocker PRO - Clean & Calendar Synced</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        .bg-viola-ritardo { background-color: #8b5cf6 !important; }
        .text-viola-ritardo { color: #8b5cf6 !important; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">

    <!-- Header / Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 px-4 py-3 flex flex-wrap justify-between items-center gap-2 shadow-md">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">⚡</span>
            <h1 class="text-lg md:text-xl font-bold tracking-wider text-indigo-400">WorkBlocker PRO</h1>
            <span id="sync-status" class="text-[10px] md:text-xs px-2 py-1 rounded bg-emerald-600 text-white font-medium">Sincronizzato</span>
        </div>
        <div class="flex items-center space-x-2">
            <button type="button" onclick="hardResetApp()" class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded text-xs font-medium transition cursor-pointer shadow">🗑️ Reset Pulizia Totale</button>
            <button type="button" onclick="triggerMorningBriefing()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded text-xs md:text-sm font-medium transition cursor-pointer shadow">☀️ Briefing</button>
            <button type="button" onclick="triggerPreAlert()" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded text-xs md:text-sm font-medium transition cursor-pointer shadow">🔔 Pre-avviso</button>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="bg-slate-800/90 border-b border-slate-700 px-4 py-2 flex space-x-2 md:space-x-4 overflow-x-auto text-xs md:text-sm">
        <button type="button" onclick="switchTab('dashboard')" id="tab-dashboard" class="px-3 py-1.5 rounded bg-indigo-600 text-white font-medium transition cursor-pointer">Dashboard</button>
        <button type="button" onclick="switchTab('pianificazione')" id="tab-pianificazione" class="px-3 py-1.5 rounded text-slate-300 hover:bg-slate-700 transition cursor-pointer">Pianificazione</button>
        <button type="button" onclick="switchTab('incorso')" id="tab-incorso" class="px-3 py-1.5 rounded text-slate-300 hover:bg-slate-700 transition cursor-pointer">In Corso</button>
        <button type="button" onclick="switchTab('archivio')" id="tab-archivio" class="px-3 py-1.5 rounded text-slate-300 hover:bg-slate-700 transition cursor-pointer">Archivio</button>
        <button type="button" onclick="switchTab('note')" id="tab-note" class="px-3 py-1.5 rounded text-slate-300 hover:bg-slate-700 transition cursor-pointer">Note Vocali</button>
    </nav>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto p-4 space-y-6">
        
        <!-- DASHBOARD -->
        <div id="section-dashboard" class="space-y-6">

            <!-- MONITORAGGIO ATTIVITÀ & GOOGLE CALENDAR PRIORITARIO -->
            <div id="active-now-container" class="bg-slate-800 p-6 rounded-xl border-2 border-indigo-500 shadow-xl space-y-4">
                <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                    <div class="flex items-center space-x-2">
                        <span class="w-3 h-3 rounded-full bg-emerald-500 animate-ping"></span>
                        <h2 class="text-md font-bold text-emerald-400 uppercase tracking-wider">Priorità Google Calendar & Attività in Corso</h2>
                    </div>
                    <span id="current-clock" class="text-xs font-mono text-slate-400"></span>
                </div>
                <div id="active-tracker-content" class="space-y-4">
                    <!-- Dinamico -->
                </div>
            </div>

            <!-- VISTA SETTIMANALE PULITA E ORDINATA -->
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg space-y-3">
                <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                    <h2 class="text-md font-semibold text-indigo-300">📅 Vista Settimanale (Priorità Calendar & WorkBlocker)</h2>
                    <span class="text-xs text-slate-400">Senza duplicati</span>
                </div>
                <div id="weekly-calendar-grid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-7 gap-2"></div>
            </div>

            <!-- FORM PROGRAMMAZIONE -->
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg space-y-4">
                <h2 class="text-lg font-semibold text-indigo-300 border-b border-slate-700 pb-2">📅 Inserisci Slot Giornaliero</h2>
                <form id="schedule-form" onsubmit="startDailySchedule(event)" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Seleziona Progetto</label>
                            <select id="sched-project" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs md:text-sm text-slate-300">
                                <option value="">Seleziona Progetto...</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Esecutore</label>
                            <input type="text" id="sched-executor" value="Matteo Pavese" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs md:text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Durata (Minuti)</label>
                            <input type="number" id="sched-minutes" value="60" oninput="calculateEndTime()" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs md:text-sm">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Orario Inizio</label>
                            <input type="time" id="sched-starttime" value="09:00" oninput="calculateEndTime()" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs md:text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Orario Fine</label>
                            <input type="time" id="sched-endtime" readonly class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-xs md:text-sm text-indigo-300 font-bold">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Giorni</label>
                        <div class="flex flex-wrap gap-3 text-xs">
                            <label class="flex items-center space-x-1 cursor-pointer"><input type="checkbox" name="day-flag" value="Lun" checked> <span>Lun</span></label>
                            <label class="flex items-center space-x-1 cursor-pointer"><input type="checkbox" name="day-flag" value="Mar" checked> <span>Mar</span></label>
                            <label class="flex items-center space-x-1 cursor-pointer"><input type="checkbox" name="day-flag" value="Mer" checked> <span>Mer</span></label>
                            <label class="flex items-center space-x-1 cursor-pointer"><input type="checkbox" name="day-flag" value="Gio" checked> <span>Gio</span></label>
                            <label class="flex items-center space-x-1 cursor-pointer"><input type="checkbox" name="day-flag" value="Ven" checked> <span>Ven</span></label>
                            <label class="flex items-center space-x-1 cursor-pointer"><input type="checkbox" name="day-flag" value="Sab"> <span>Sab</span></label>
                            <label class="flex items-center space-x-1 cursor-pointer"><input type="checkbox" name="day-flag" value="Dom"> <span>Dom</span></label>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded text-xs md:text-sm transition cursor-pointer">Aggiungi alla Griglia</button>
                </form>
            </div>
        </div>

        <!-- PIANIFICAZIONE -->
        <div id="section-pianificazione" class="space-y-6 hidden">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg space-y-4">
                <h2 id="form-proj-title" class="text-xl font-semibold text-indigo-300 border-b border-slate-700 pb-2">📁 Nuova Scheda Progetto</h2>
                <form id="project-form" onsubmit="saveProject(event)" class="space-y-4">
                    <input type="hidden" id="editing-proj-id" value="">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Nome Progetto</label>
                            <input type="text" id="p-name" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs md:text-sm">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">Colore</label>
                                <input type="color" id="p-color" value="#4f46e5" class="w-full h-9 bg-slate-900 border border-slate-700 rounded cursor-pointer p-1">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">Scadenza Finale</label>
                                <input type="date" id="p-enddate" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs md:text-sm">
                            </div>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Milestones (Nome e Scadenza)</label>
                        <div id="milestones-container" class="space-y-3 mb-2">
                            <div class="bg-slate-900 p-3 rounded border border-slate-700 space-y-2 milestone-block">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                                    <input type="text" placeholder="Nome Milestone" class="m-name w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-xs">
                                    <input type="date" placeholder="Scadenza" class="m-subdate w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-xs">
                                </div>
                            </div>
                        </div>
                        <button type="button" onclick="addMilestoneField()" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium cursor-pointer">+ Aggiungi Milestone</button>
                    </div>
                    <div class="flex space-x-2">
                        <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded text-xs md:text-sm transition cursor-pointer">Salva Progetto</button>
                        <button type="button" onclick="resetProjectForm()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded text-xs md:text-sm cursor-pointer">Annulla</button>
                    </div>
                </form>
            </div>
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg space-y-4">
                <h2 class="text-lg font-semibold text-indigo-300 border-b border-slate-700 pb-2">📋 Progetti Pianificati</h2>
                <div id="planned-projects-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>
        </div>

        <!-- IN CORSO -->
        <div id="section-incorso" class="space-y-6 hidden">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg space-y-4">
                <h2 class="text-xl font-semibold text-indigo-300 border-b border-slate-700 pb-2">🚀 Progetti Attivi</h2>
                <div id="in-progress-projects-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>
        </div>

        <!-- ARCHIVIO -->
        <div id="section-archivio" class="space-y-6 hidden">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg space-y-4">
                <h2 class="text-xl font-semibold text-indigo-300 border-b border-slate-700 pb-2">🗄️ Archivio</h2>
                <div id="archive-list" class="space-y-4"></div>
            </div>
        </div>

        <!-- NOTE VOCALI -->
        <div id="section-note" class="space-y-6 hidden">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg space-y-4 max-w-xl mx-auto">
                <h2 class="text-xl font-semibold text-indigo-300 border-b border-slate-700 pb-2">🎙️ Note Vocali</h2>
                <div class="space-y-3">
                    <select id="note-project-select" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs md:text-sm text-slate-300">
                        <option value="">Seleziona Progetto...</option>
                    </select>
                    <button type="button" onclick="toggleVoiceRecording()" class="w-full bg-rose-600 hover:bg-rose-700 py-2 rounded text-xs md:text-sm font-medium transition cursor-pointer">Avvia Registrazione</button>
                    <textarea id="voice-note-text" placeholder="Trascrizione..." class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs md:text-sm h-24 focus:outline-none"></textarea>
                    <button type="button" onclick="saveVoiceNote()" class="w-full bg-indigo-600 hover:bg-indigo-700 py-2 rounded text-xs md:text-sm font-medium transition cursor-pointer">Salva Nota</button>
                </div>
            </div>
        </div>

    </main>

    <!-- Modal Dettaglio -->
    <div id="detail-modal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 max-w-xl w-full space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                <h3 id="modal-title" class="text-lg font-bold text-indigo-300">Dettaglio</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white text-lg font-bold cursor-pointer">&times;</button>
            </div>
            <div id="modal-content" class="space-y-3 text-sm"></div>
            <div class="flex justify-between pt-2 border-t border-slate-700">
                <button id="modal-edit-btn" onclick="" class="bg-indigo-600 hover:bg-indigo-700 px-4 py-1.5 rounded text-xs cursor-pointer">Modifica</button>
                <button onclick="closeModal()" class="bg-slate-700 hover:bg-slate-600 px-4 py-1.5 rounded text-xs cursor-pointer">Chiudi</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDivabIe2alybtGmwemXHbvYigaEkvP9g",
            authDomain: "workblocker-app.firebaseapp.com",
            databaseURL: "https://workblocker-app-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "workblocker-app",
            storageBucket: "workblocker-app.firebasestorage.app",
            messagingSenderId: "1090382572776",
            appId: "1:1090382572776:web:cab134e37e9d5b0eafed5d"
        };

        // Eventi reali di Google Calendar per oggi (12/10/2026) con priorità assoluta
        const googleCalendarTodayEvents = [
            { id: 'cal-1', projectName: 'Banco desio fido e fin', startT: '10:00', endT: '10:25', color: '#3b82f6', days: ['Lun'], isCalendar: true },
            { id: 'cal-2', projectName: 'Call Noemi', startT: '11:30', endT: '11:55', color: '#10b981', days: ['Lun'], isCalendar: true }
        ];

        let appData = JSON.parse(localStorage.getItem('workblocker_clean_data')) || {
            projects: [], inProgress: [], schedules: [], archive: [], notes: []
        };

        let mainClockInterval = null;

        document.addEventListener("DOMContentLoaded", () => {
            calculateEndTime();
            renderUI();
            initFirebaseConnection();
            startMainClock();
        });

        function hardResetApp() {
            if (confirm("Vuoi ripulire completamente la griglia da tutti i duplicati accumulati?")) {
                appData.schedules = [];
                saveToCloud();
                renderUI();
                alert("Griglia pulita con successo!");
            }
        }

        function startMainClock() {
            if (mainClockInterval) clearInterval(mainClockInterval);
            mainClockInterval = setInterval(() => {
                const now = new Date();
                const clockEl = document.getElementById('current-clock');
                if (clockEl) {
                    clockEl.innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                }
                updateActiveTracker(now);
            }, 1000);
        }

        function updateActiveTracker(now) {
            const container = document.getElementById('active-tracker-content');
            if (!container) return;

            const daysMap = ['Dom', 'Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab'];
            const todayDay = daysMap[now.getDay()];
            const currentTimeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            // Cerca prima tra gli eventi di Google Calendar di oggi
            let activeEvent = googleCalendarTodayEvents.find(e => currentTimeStr >= e.startT && currentTimeStr <= e.endT);
            
            // Se non c'è un evento calendar in corso, cerca tra gli slot WorkBlocker
            if (!activeEvent) {
                activeEvent = appData.schedules.find(s => s.days && s.days.includes(todayDay) && currentTimeStr >= s.startT && currentTimeStr <= s.endT);
            }

            // Fallback sul prossimo evento della giornata se nessuno è attivo al minuto esatto
            if (!activeEvent) {
                activeEvent = googleCalendarTodayEvents[0] || appData.schedules[0];
            }

            if (activeEvent) {
                const isCalendarEvent = activeEvent.isCalendar;
                const proj = isCalendarEvent ? activeEvent : (appData.inProgress.concat(appData.projects).find(p => p.id == activeEvent.projectId) || activeEvent);
                
                const startDate = new Date(proj.creationDate || now);
                const endDate = new Date(proj.endDate || '2026-12-31');
                const totalSpan = Math.max(1, endDate - startDate);
                const elapsed = Math.max(0, now - startDate);
                let progressPercent = Math.min(100, Math.round((elapsed / totalSpan) * 100));

                let isDelayed = now > endDate;
                if (proj.milestones) {
                    proj.milestones.forEach(m => {
                        if (m.subDate && !m.completed && now > new Date(m.subDate)) isDelayed = true;
                    });
                }

                let milestonesListHtml = isCalendarEvent ? '<p class="text-xs text-slate-400">Impegno sincronizzato da Google Calendar (Priorità attiva).</p>' : 
                    (proj.milestones || []).map((m, idx) => `
                        <div class="flex items-center justify-between p-2 rounded bg-slate-900 border border-slate-700 text-xs">
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" ${m.completed ? 'checked' : ''} onchange="toggleMilestone(${proj.id}, ${idx})" class="rounded text-indigo-600">
                                <span class="${m.completed ? 'line-through text-slate-500' : 'text-slate-200 font-medium'}">${m.name}</span>
                            </label>
                            <span class="text-[11px] text-slate-400">${m.subDate ? `Scadenza: ${m.subDate}` : ''}</span>
                        </div>
                    `).join('');

                container.innerHTML = `
                    <div class="flex items-center justify-between">
                        <h3 class="text-xl font-bold text-white uppercase tracking-wide" style="color: ${proj.color || '#3b82f6'}">${proj.projectName || proj.name}</h3>
                        <span class="text-xs px-2 py-1 rounded bg-blue-900 text-blue-200 font-semibold">${isCalendarEvent ? '📅 Google Calendar' : '⚡ WorkBlocker Slot'}</span>
                    </div>
                    <div class="text-xs text-slate-300">Orario: <b>${activeEvent.startT} - ${activeEvent.endT}</b></div>
                    
                    <div class="w-full space-y-1">
                        <div class="flex justify-between text-xs text-slate-400">
                            <span>Avvio Progetto: ${startDate.toLocaleDateString()}</span>
                            <span class="${isDelayed ? 'text-viola-ritardo font-bold' : 'text-emerald-400 font-bold'}">${isDelayed ? '⚠️ RITARDO' : 'In Corso'} (${progressPercent}%)</span>
                            <span>Scadenza: ${endDate.toLocaleDateString()}</span>
                        </div>
                        <div class="relative w-full bg-slate-700 h-4 rounded-full overflow-hidden">
                            <div class="${isDelayed ? 'bg-viola-ritardo' : 'bg-indigo-600'} h-4 rounded-full transition-all duration-500" style="width: ${progressPercent}%;"></div>
                        </div>
                    </div>

                    <div class="w-full space-y-2 pt-2">
                        <span class="text-xs font-bold text-indigo-300">Milestone & Dettagli:</span>
                        ${milestonesListHtml}
                    </div>
                `;
            } else {
                container.innerHTML = `<div class="text-slate-400 text-sm py-3 text-center">Nessun impegno in corso al momento.</div>`;
            }
        }

        function toggleMilestone(projId, idx) {
            const proj = appData.inProgress.concat(appData.projects).find(p => p.id == projId);
            if (proj && proj.milestones && proj.milestones[idx]) {
                proj.milestones[idx].completed = !proj.milestones[idx].completed;
                saveToCloud();
                renderUI();
            }
        }

        function initFirebaseConnection() {
            try {
                firebase.initializeApp(firebaseConfig);
                const db = firebase.database();
                db.ref('workblocker_clean_data').on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        appData = {
                            projects: data.projects || [],
                            inProgress: data.inProgress || [],
                            schedules: cleanUniqueSchedules(data.schedules || []),
                            archive: data.archive || [],
                            notes: data.notes || []
                        };
                        localStorage.setItem('workblocker_clean_data', JSON.stringify(appData));
                    }
                    renderUI();
                });
            } catch(e) {}
        }

        function cleanUniqueSchedules(schedules) {
            const map = new Map();
            schedules.forEach(s => {
                const key = `${s.projectId}-${s.startT}-${s.endT}-${(s.days||[]).sort().join('')}`;
                if (!map.has(key)) map.set(key, s);
            });
            return Array.from(map.values());
        }

        function saveToCloud() {
            appData.schedules = cleanUniqueSchedules(appData.schedules);
            localStorage.setItem('workblocker_clean_data', JSON.stringify(appData));
            try { firebase.database().ref('workblocker_clean_data').set(appData); } catch(e){}
        }

        function switchTab(tabId) {
            ['dashboard', 'pianificazione', 'incorso', 'archivio', 'note'].forEach(t => {
                document.getElementById(`section-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).className = "px-3 py-1.5 rounded text-slate-300 hover:bg-slate-700 transition cursor-pointer";
            });
            document.getElementById(`section-${tabId}`).classList.remove('hidden');
            document.getElementById(`tab-${tabId}`).className = "px-3 py-1.5 rounded bg-indigo-600 text-white font-medium transition cursor-pointer";
        }

        function calculateEndTime() {
            const startEl = document.getElementById('sched-starttime');
            const minEl = document.getElementById('sched-minutes');
            const endEl = document.getElementById('sched-endtime');
            if(!startEl || !minEl || !endEl) return;
            const startStr = startEl.value || "09:00";
            const minutes = parseInt(minEl.value) || 60;
            const [h, m] = startStr.split(':').map(Number);
            const date = new Date();
            date.setHours(h, m + minutes, 0);
            endEl.value = `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
        }

        function addMilestoneField(name = '', subDate = '') {
            const container = document.getElementById('milestones-container');
            const div = document.createElement('div');
            div.className = 'bg-slate-900 p-3 rounded border border-slate-700 space-y-2 milestone-block';
            div.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                    <input type="text" placeholder="Nome Milestone" value="${name}" class="m-name w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-xs">
                    <input type="date" placeholder="Scadenza" value="${subDate}" class="m-subdate w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-xs">
                </div>
            `;
            container.appendChild(div);
        }

        function saveProject(e) {
            e.preventDefault();
            const name = document.getElementById('p-name').value;
            const color = document.getElementById('p-color').value;
            const endDate = document.getElementById('p-enddate').value;
            
            const blocks = document.querySelectorAll('.milestone-block');
            const milestones = Array.from(blocks).map(b => ({
                name: b.querySelector('.m-name').value,
                subDate: b.querySelector('.m-subdate').value,
                completed: false
            })).filter(m => m.name.trim() !== '');

            appData.projects.push({ id: Date.now(), creationDate: new Date().toISOString().split('T')[0], name, color, endDate, milestones });
            saveToCloud();
            resetProjectForm();
            switchTab('pianificazione');
            renderUI();
            alert('Progetto salvato con successo!');
        }

        function startDailySchedule(e) {
            e.preventDefault();
            const projId = document.getElementById('sched-project').value;
            const executor = document.getElementById('sched-executor').value;
            const startT = document.getElementById('sched-starttime').value;
            const endT = document.getElementById('sched-endtime').value;
            const checkedDays = Array.from(document.querySelectorAll('input[name="day-flag"]:checked')).map(cb => cb.value);

            const proj = appData.projects.find(p => p.id == projId) || appData.inProgress.find(p => p.id == projId);
            if (!proj) return;

            if (!appData.inProgress.some(p => p.id == proj.id)) {
                appData.inProgress.push(proj);
            }

            appData.schedules.push({
                id: Date.now(),
                projectId: proj.id,
                projectName: proj.name,
                color: proj.color,
                executor,
                startT,
                endT,
                days: checkedDays
            });

            saveToCloud();
            renderUI();
            alert('Slot aggiunto con successo!');
        }

        function renderUI() {
            const projSelect = document.getElementById('sched-project');
            const noteSelect = document.getElementById('note-project-select');
            if(projSelect && noteSelect) {
                projSelect.innerHTML = '<option value="">Seleziona Progetto...</option>';
                noteSelect.innerHTML = '<option value="">Seleziona Progetto...</option>';
                appData.projects.concat(appData.inProgress).forEach(p => {
                    projSelect.innerHTML += `<option value="${p.id}">${p.name}</option>`;
                    noteSelect.innerHTML += `<option value="${p.id}">${p.name}</option>`;
                });
            }

            const plannedList = document.getElementById('planned-projects-list');
            if(plannedList) {
                plannedList.innerHTML = appData.projects.length === 0 ? '<p class="text-xs text-slate-400">Nessun progetto.</p>' : '';
                appData.projects.forEach(p => {
                    plannedList.innerHTML += `<div class="bg-slate-900 p-4 rounded border border-slate-700"><span class="font-bold text-sm" style="color: ${p.color}">${p.name}</span><p class="text-xs text-slate-400">Scadenza: ${p.endDate}</p></div>`;
                });
            }

            const inProgVert = document.getElementById('in-progress-projects-list');
            if(inProgVert) {
                inProgVert.innerHTML = appData.inProgress.length === 0 ? '<p class="text-xs text-slate-400">Nessun progetto attivo.</p>' : '';
                appData.inProgress.forEach(p => {
                    inProgVert.innerHTML += `<div class="bg-slate-900 p-4 rounded border border-slate-700"><span class="font-bold text-sm" style="color: ${p.color}">${p.name}</span><p class="text-xs text-slate-400">Scadenza: ${p.endDate}</p></div>`;
                });
            }

            // CALENDARIO SETTIMANALE CON PRIORITA GOOGLE CALENDAR
            const daysOrder = ['Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab', 'Dom'];
            const grid = document.getElementById('weekly-calendar-grid');
            if(grid) {
                grid.innerHTML = '';
                const curr = new Date();
                const first = curr.getDate() - curr.getDay() + 1;
                daysOrder.forEach((day, idx) => {
                    const d = new Date(curr.setDate(first + idx));
                    const dateStr = `${d.getDate()}/${d.getMonth()+1}`;

                    let dayTasks = [];
                    if (day === 'Lun') {
                        dayTasks = dayTasks.concat(googleCalendarTodayEvents);
                    }
                    dayTasks = dayTasks.concat(appData.schedules.filter(s => s.days && s.days.includes(day)));
                    
                    // Ordina per orario
                    dayTasks.sort((a, b) => (a.startT || "00:00").localeCompare(b.startT || "00:00"));

                    let tasksHtml = dayTasks.map(t => `
                        <div class="p-2 rounded text-xs shadow mb-1 border" style="background-color: ${t.color || '#4f46e5'}33; border-color: ${t.color || '#4f46e5'};">
                            <div class="font-bold text-white">${t.projectName || t.name}</div>
                            <div class="text-[10px] text-slate-200">${t.startT} - ${t.endT} ${t.isCalendar ? '📅' : ''}</div>
                        </div>
                    `).join('');

                    grid.innerHTML += `
                        <div class="bg-slate-900 p-3 rounded border border-slate-700 min-h-[150px]">
                            <div class="text-xs font-bold text-indigo-300 border-b border-slate-800 pb-1 mb-2 text-center">${day} (${dateStr})</div>
                            ${tasksHtml || '<span class="text-[10px] text-slate-600 block text-center mt-6">Libero</span>'}
                        </div>
                    `;
                });
            }
        }

        function resetProjectForm() {
            document.getElementById('project-form').reset();
            document.getElementById('editing-proj-id').value = '';
        }

        function triggerMorningBriefing() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance("Buongiorno Matteo. Oggi hai in programma gli impegni da Google Calendar e i progetti di studio.");
                utterance.lang = 'it-IT';
                window.speechSynthesis.speak(utterance);
            }
        }

        function triggerPreAlert() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance("Attenzione. Tra trenta secondi si avvia il prossimo slot.");
                utterance.lang = 'it-IT';
                window.speechSynthesis.speak(utterance);
            }
        }

        function toggleVoiceRecording() {
            const textArea = document.getElementById('voice-note-text');
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) return alert('Non supportato.');
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'it-IT';
            recognition.onresult = function(e) { textArea.value = e.results[0][0].transcript; };
            recognition.start();
        }

        function saveVoiceNote() {
            const projId = document.getElementById('note-project-select').value;
            const text = document.getElementById('voice-note-text').value;
            if(!projId || !text) return alert('Seleziona progetto e testo.');
            appData.notes.push({ projId, text, date: new Date().toLocaleDateString() });
            saveToCloud();
            document.getElementById('voice-note-text').value = '';
            alert('Nota salvata!');
        }
    </script>
</body>
</html>
