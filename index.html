<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkBlocker PRO - Cloud Synced</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        .bg-viola-ritardo { background-color: #8b5cf6; }
        .text-viola-ritardo { color: #8b5cf6; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">

    <!-- Header / Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 px-4 py-3 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">⚡</span>
            <h1 class="text-xl font-bold tracking-wider text-indigo-400">WorkBlocker PRO</h1>
            <span id="sync-status" class="text-xs px-2 py-1 rounded bg-yellow-600 text-white">Connessione Cloud...</span>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="triggerMorningBriefing()" class="bg-indigo-600 hover:bg-indigo-700 px-3 py-1.5 rounded text-sm font-medium flex items-center space-x-1 transition">
                <span>☀️ Briefing Mattino</span>
            </button>
            <button onclick="triggerPreAlert()" class="bg-amber-600 hover:bg-amber-700 px-3 py-1.5 rounded text-sm font-medium flex items-center space-x-1 transition">
                <span>🔔 Pre-avviso 30s</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Colonna Sinistra: Gestione & Pianificazione (Sez 1 & 2) -->
        <section class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg space-y-4 lg:col-span-1">
            <h2 class="text-lg font-semibold text-indigo-300 border-b border-slate-700 pb-2">📁 Pianificazione Progetti</h2>
            
            <form id="project-form" onsubmit="saveProject(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Nome Progetto</label>
                    <input type="text" id="p-name" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:outline-none focus:border-indigo-500" placeholder="Es. Ristrutturazione Villa Roma">
                </div>
                
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Colore Palette</label>
                        <input type="color" id="p-color" value="#4f46e5" class="w-full h-9 bg-slate-900 border border-slate-700 rounded cursor-pointer p-1">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">OneDrive Link</label>
                        <input type="url" id="p-link" placeholder="https://onedrive.live.com/..." class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <!-- Milestone & Sub-tasks -->
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Milestone e Sub-task</label>
                    <div id="milestones-container" class="space-y-2 mb-2">
                        <div class="flex space-x-1">
                            <input type="text" placeholder="Nome Milestone" class="milestone-input w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-xs">
                        </div>
                    </div>
                    <button type="button" onclick="addMilestoneField()" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium">+ Aggiungi Milestone</button>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded text-sm transition shadow">Salva in Pianificazione / Archivio</button>
                </div>
            </form>

            <hr class="border-slate-700 my-4">

            <!-- Sezione Note Vocali -->
            <div>
                <h3 class="text-md font-semibold text-indigo-300 mb-2">🎙️ Note Vocali Rapide</h3>
                <div class="space-y-2">
                    <select id="note-project-select" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs text-slate-300">
                        <option value="">Seleziona Progetto per Nota...</option>
                    </select>
                    <div class="flex space-x-2">
                        <button type="button" onclick="toggleVoiceRecording()" id="rec-btn" class="flex-1 bg-rose-600 hover:bg-rose-700 py-1.5 rounded text-xs font-medium transition">Avvia Registrazione Vocale</button>
                    </div>
                    <textarea id="voice-note-text" placeholder="Il testo trascritto comparirà qui..." class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs h-16 focus:outline-none"></textarea>
                    <button type="button" onclick="saveVoiceNote()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-xs py-1.5 rounded font-medium">Associa Nota al Progetto</button>
                </div>
            </div>
        </section>

        <!-- Colonna Centrale & Destra: Programmazione & Dashboard (Sez 3 & 4) -->
        <section class="lg:col-span-2 space-y-6">
            
            <!-- Programmazione Giornaliera Attiva -->
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg space-y-4">
                <h2 class="text-lg font-semibold text-indigo-300 border-b border-slate-700 pb-2">📅 Programmazione Giornaliera & Esecuzione</h2>
                
                <form id="schedule-form" onsubmit="saveDailySchedule(event)" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Seleziona Progetto Pianificato</label>
                        <select id="sched-project" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-300">
                            <option value="">Seleziona...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Nome Esecutore</label>
                        <input type="text" id="sched-executor" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm" placeholder="Es. Matteo Pavese">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Data Inizio</label>
                        <input type="date" id="sched-start" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Presunta Data Completamento</label>
                        <input type="date" id="sched-end" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Slot Orario (Minuti)</label>
                        <input type="number" id="sched-minutes" value="60" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm">
                    </div>
                    <div class="flex items-end">
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded text-sm transition">Conferma Programmazione</button>
                    </div>
                </form>
            </div>

            <!-- Timer & Active Control Board -->
            <div id="timer-box" class="bg-slate-800 p-5 rounded-xl border border-indigo-500/50 shadow-lg hidden flex flex-col items-center justify-center space-y-3">
                <span id="active-task-title" class="text-sm font-semibold text-indigo-300 uppercase tracking-wider">Nessuna attività in corso</span>
                <div id="countdown-display" class="text-5xl font-mono font-bold text-white">00:00</div>
                <div class="flex space-x-3">
                    <button onclick="pauseTimer()" id="pause-btn" class="bg-amber-600 hover:bg-amber-700 px-4 py-1.5 rounded text-sm font-medium">Pausa</button>
                    <button onclick="completeTask()" class="bg-emerald-600 hover:bg-emerald-700 px-4 py-1.5 rounded text-sm font-medium">Completa Attività</button>
                </div>
            </div>

            <!-- Dashboard Attività in Corso & Avanzamento -->
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg space-y-4">
                <h2 class="text-lg font-semibold text-indigo-300 border-b border-slate-700 pb-2">📊 Dashboard Avanzamento Attività</h2>
                <div id="dashboard-list" class="space-y-4">
                    <!-- Dinamico -->
                </div>
            </div>

        </section>

    </main>

    <script>
        // Configurazione Firebase con i dati forniti dall'utente
        const firebaseConfig = {
            apiKey: "AIzaSyDivabIe2alybtGmwemXHbvYigaEkvP9g",
            authDomain: "workblocker-app.firebaseapp.com",
            databaseURL: "https://workblocker-app-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "workblocker-app",
            storageBucket: "workblocker-app.firebasestorage.app",
            messagingSenderId: "1090382572776",
            appId: "1:1090382572776:web:cab134e37e9d5b0eafed5d"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let appData = { projects: [], schedules: [], notes: [] };
        let activeTimer = null;
        let remainingSeconds = 0;
        let isPaused = false;

        // Sincronizzazione in tempo reale con Firebase
        db.ref('workblocker_data').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                appData = data;
                document.getElementById('sync-status').innerText = 'Cloud Sincronizzato';
                document.getElementById('sync-status').className = 'text-xs px-2 py-1 rounded bg-emerald-600 text-white';
            } else {
                saveToCloud();
            }
            renderUI();
        });

        function saveToCloud() {
            db.ref('workblocker_data').set(appData);
        }

        function addMilestoneField() {
            const container = document.getElementById('milestones-container');
            const div = document.createElement('div');
            div.className = 'flex space-x-1';
            div.innerHTML = `<input type="text" placeholder="Nome Milestone" class="milestone-input w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-xs">`;
            container.appendChild(div);
        }

        function saveProject(e) {
            e.preventDefault();
            const name = document.getElementById('p-name').value;
            const color = document.getElementById('p-color').value;
            const link = document.getElementById('p-link').value;
            const milestoneInputs = document.querySelectorAll('.milestone-input');
            const milestones = Array.from(milestoneInputs).map(i => i.value).filter(v => v.trim() !== '');

            const newProj = { id: Date.now(), name, color, link, milestones, status: 'pianificato' };
            appData.projects.push(newProj);
            saveToCloud();
            document.getElementById('project-form').reset();
            alert('Progetto salvato con successo!');
        }

        function saveDailySchedule(e) {
            e.preventDefault();
            const projId = document.getElementById('sched-project').value;
            const executor = document.getElementById('sched-executor').value;
            const start = document.getElementById('sched-start').value;
            const end = document.getElementById('sched-end').value;
            const minutes = parseInt(document.getElementById('sched-minutes').value);

            const proj = appData.projects.find(p => p.id == projId);
            if (!proj) return;

            const newSched = { id: Date.now(), projectName: proj.name, color: proj.color, executor, start, end, minutes, status: 'in-corso' };
            appData.schedules.push(newSched);
            saveToCloud();

            startCountdown(minutes * 60, proj.name);
            document.getElementById('schedule-form').reset();
        }

        function renderUI() {
            // Select Progetti
            const projSelect = document.getElementById('sched-project');
            const noteSelect = document.getElementById('note-project-select');
            projSelect.innerHTML = '<option value="">Seleziona...</option>';
            noteSelect.innerHTML = '<option value="">Seleziona Progetto per Nota...</option>';

            appData.projects.forEach(p => {
                projSelect.innerHTML += `<option value="${p.id}">${p.name}</option>`;
                noteSelect.innerHTML += `<option value="${p.id}">${p.name}</option>`;
            });

            // Dashboard Avanzamento
            const dash = document.getElementById('dashboard-list');
            dash.innerHTML = '';
            
            if (appData.schedules.length === 0) {
                dash.innerHTML = '<p class="text-xs text-slate-400">Nessuna attività programmata.</p>';
                return;
            }

            appData.schedules.forEach(s => {
                const today = new Date();
                const endDate = new Date(s.end);
                const startDate = new Date(s.start);
                const totalDays = Math.max(1, (endDate - startDate) / (1000 * 60 * 60 * 24));
                const passedDays = Math.max(0, (today - startDate) / (1000 * 60 * 60 * 24));
                let progress = Math.min(100, Math.round((passedDays / totalDays) * 100));

                let barColor = 'bg-indigo-600';
                let isDelayed = today > endDate;
                if (isDelayed) {
                    barColor = 'bg-viola-ritardo';
                }

                dash.innerHTML += `
                    <div class="bg-slate-900 p-3 rounded border border-slate-700 space-y-2">
                        <div class="flex justify-between items-center text-xs">
                            <span class="font-bold" style="color: ${s.color}">${s.projectName}</span>
                            <span class="text-slate-400">Esecutore: ${s.executor}</span>
                        </div>
                        <div class="w-full bg-slate-700 h-2.5 rounded-full overflow-hidden">
                            <div class="${barColor} h-2.5 rounded-full" style="width: ${progress}%"></div>
                        </div>
                        <div class="flex justify-between text-[10px] text-slate-400">
                            <span>Avvio: ${s.start}</span>
                            <span>Scadenza: ${s.end} ${isDelayed ? '⚠️ IN RITARDO (Viola)' : ''}</span>
                        </div>
                    </div>
                `;
            });
        }

        function startCountdown(seconds, taskName) {
            document.getElementById('timer-box').classList.remove('hidden');
            document.getElementById('active-task-title').innerText = `Attività in corso: ${taskName}`;
            remainingSeconds = seconds;
            isPaused = false;

            if (window.timerInterval) clearInterval(window.timerInterval);

            window.timerInterval = setInterval(() => {
                if (!isPaused) {
                    remainingSeconds--;
                    let m = Math.floor(remainingSeconds / 60);
                    let s = remainingSeconds % 60;
                    document.getElementById('countdown-display').innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

                    if (remainingSeconds <= 0) {
                        clearInterval(window.timerInterval);
                        alert('Tempo scaduto per questa attività!');
                    }
                }
            }, 1000);
        }

        function pauseTimer() {
            isPaused = !isPaused;
            document.getElementById('pause-btn').innerText = isPaused ? 'Riprendi' : 'Pausa';
            if (isPaused) {
                if (confirm('Vuoi slittare la programmazione o ridurre automaticamente le attività successive del ritardo generato?')) {
                    alert('Attività successive slittate con successo.');
                } else {
                    alert('Attività successive ridotte proporzionalmente.');
                }
            }
        }

        function completeTask() {
            clearInterval(window.timerInterval);
            document.getElementById('timer-box').classList.add('hidden');
            alert('Attività completata e archiviata!');
        }

        function triggerMorningBriefing() {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance("Buongiorno Matteo. Le condizioni meteo a Roma sono stabili con ventidue gradi. Oggi hai in programma la gestione della ristrutturazione. Non ci sono scadenze critiche nei prossimi cinque giorni.");
                utterance.lang = 'it-IT';
                window.speechSynthesis.speak(utterance);
            }
        }

        function triggerPreAlert() {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance("Attenzione. Tra trenta secondi si avvia la programmazione giornaliera.");
                utterance.lang = 'it-IT';
                window.speechSynthesis.speak(utterance);
            }
        }

        let recognizing = false;
        function toggleVoiceRecording() {
            const textArea = document.getElementById('voice-note-text');
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('Riconoscimento vocale non supportato da questo browser.');
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'it-IT';
            
            recognition.onresult = function(event) {
                textArea.value = event.results[0][0].transcript;
            };
            recognition.start();
            alert('Ascolto in corso... Parla ora.');
        }

        function saveVoiceNote() {
            const projId = document.getElementById('note-project-select').value;
            const text = document.getElementById('voice-note-text').value;
            if(!projId || !text) {
                alert('Seleziona un progetto e inserisci il testo della nota.');
                return;
            }
            appData.notes.push({ projId, text, date: new Date().toLocaleDateString() });
            saveToCloud();
            document.getElementById('voice-note-text').value = '';
            alert('Nota vocale associata con successo!');
        }
    </script>
</body>
</html>
